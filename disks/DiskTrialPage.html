{{ block title }}
    Trial
{{ endblock }}

{{ block content }}
<style>
    .choices > div {
        cursor: pointer;
    }
</style>
    <div class="row choices">
        <div class="col-6" id="choice_1">

        </div>
        <div class="col-6" id="choice_2">
        </div>
    </div>
    <div class="row">
        <div class="col-3"></div>
        <div class="col-6" id="target_img"></div>
        <div class="col-3"></div>
    </div>
    <input type="hidden" id="trial" value="{{ trial_id }}" />
    <input type="hidden" id="foil" value="{{ foil }}" />
    <input type="hidden" id="oddball" value="{{ oddball }}" />
    <input type="hidden" id="target" value="{{ target }}" />

    <script>
        let choice1 = null;
        let choice2 = null;
        let liveRecv = function (data) {
            // placeholder
            console.log('received', data);
        }
        // listen for messages from the server
        

        document.addEventListener("DOMContentLoaded", (event) => {
            // initial page load, use hidden fields to populate the page
            const trial = document.getElementById('trial');
            const foil = document.getElementById('foil');
            const oddball = document.getElementById('oddball');
            const target = document.getElementById('target');
            const choice1El = document.getElementById('choice_1');
            const choice2El = document.getElementById('choice_2');
            const target_img = document.getElementById('target_img');
            
            const choice1Img = document.createElement('img');
            choice1Img.id = 'choice1_img';
            choice1Img.classList.add('img-fluid');
            
            const choice2Img = document.createElement('img');
            choice2Img.id = 'choice2_img';
            choice2Img.classList.add('img-fluid');

            targetImg = document.createElement('img');
            targetImg.id = 'target_img';
            targetImg.classList.add('img-fluid');

            function updateTrial() {
                // randomly assign the foil and oddball to the two choices
                if (Math.random() < 0.5) {
                    choice1 = "/static/" + foil.value;
                    choice2 = "/static/" + oddball.value;
                } else {
                    choice1 = "/static/" + oddball.value;
                    choice2 = "/static/" + foil.value;
                }
                choice1Img.src = choice1;
                choice2Img.src = choice2;
                targetImg.src = "/static/" + target.value;
            }
            
            updateTrial();

            choice1El.appendChild(choice1Img);
            choice2El.appendChild(choice2Img);
            target_img.appendChild(targetImg);

            liveRecv = function(data) {
                const event = Object.keys(data).includes('event') ? data.event : null;
                console.log(data);
                console.log(event);
                switch (event) {
                    case 'next':
                        // show result, then request next trial
                        liveSend({ event: 'next' });
                        break;
                    case 'trial':
                        // update the trial
                        trial.value = data.trial_id;
                        foil.value = data.foil;
                        oddball.value = data.oddball;
                        target.value = data.target;
                        updateTrial();
                        break;
                        
                    default:
                        break;
                }
            }

            // add event listeners for clicks on the choices
            choice1El.addEventListener('click', (event) => {
                liveSend({ event: 'choice', trial: trial.value, choice: choice1 });
            });
            choice2El.addEventListener('click', (event) => {
                liveSend({ event: 'choice', trial: trial.value, choice: choice2 });
            });

        });
    </script>
{{ endblock }}
